name: Code 42
description: >-
  Code42 (now part of Mimecast) is a security software company whose Incydr
  product is a SaaS Insider Risk Management (IRM) platform that detects, and
  responds to data exfiltration and insider threats across endpoints, cloud,
  email, and browsers. Code42 exposes a public OAuth 2.0 REST API through its
  regional API gateways (api.us.code42.com and other regions) covering actors,
  agents, alert rules, audit log, cases, file events, sessions, users, and
  watchlists. Developers integrate via the official Incydr Python SDK, the
  incydr command-line interface, and the legacy py42 SDK. This profile was added
  to the API Evangelist network as a portfolio-company lead (backed by Accel)
  and has been enriched from Code42's public developer surface.
